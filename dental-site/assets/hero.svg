<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 672" width="560" height="672" role="img" aria-label="Stylized luxury dental smile artwork">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#166364"/>
      <stop offset="0.55" stop-color="#114b4c"/>
      <stop offset="1" stop-color="#0c3b3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#2a8a86" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0c3b3c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8f3ef"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3cd9c"/>
      <stop offset="1" stop-color="#c8a45c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#04211f" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="560" height="672" fill="url(#bg)"/>
  <rect width="560" height="672" fill="url(#glow)"/>

  <!-- soft concentric arcs -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2">
    <circle cx="280" cy="300" r="120"/>
    <circle cx="280" cy="300" r="180"/>
    <circle cx="280" cy="300" r="240"/>
  </g>

  <!-- glossy tooth -->
  <g filter="url(#soft)">
    <path d="M280 150c-48 0-66 28-114 28-38 0-56-19-56 38 0 86 28 238 86 238 28 0 28-66 56-66s28 66 56 66c58 0 86-152 86-238 0-57-18-38-56-38-48 0-66-28-114-28Z"
          fill="url(#tooth)"/>
    <path d="M230 200c-14 6-22 22-22 44" fill="none" stroke="#cfe6df" stroke-width="6" stroke-linecap="round" stroke-opacity="0.7"/>
  </g>

  <!-- smile arc -->
  <path d="M196 392q84 70 168 0" fill="none" stroke="url(#gold)" stroke-width="10" stroke-linecap="round"/>

  <!-- sparkles -->
  <g fill="url(#gold)">
    <path d="M398 168l7 18 18 7-18 7-7 18-7-18-18-7 18-7z"/>
    <path d="M150 250l5 13 13 5-13 5-5 13-5-13-13-5 13-5z"/>
    <path d="M392 470l4 11 11 4-11 4-4 11-4-11-11-4 11-4z"/>
  </g>
</svg>
