<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-label="Doctor portrait">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#155e5c"/>
      <stop offset="1" stop-color="#2a8a86"/>
    </linearGradient>
    <linearGradient id="coat3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef6f2"/>
    </linearGradient>
  </defs>
  <rect width="400" height="480" fill="url(#bg3)"/>
  <circle cx="200" cy="180" r="120" fill="#ffffff" opacity="0.08"/>
  <!-- shoulders / coat -->
  <path d="M70 480c0-86 58-150 130-150s130 64 130 150Z" fill="url(#coat3)"/>
  <path d="M200 330l-26 150h52Z" fill="#e8f0ec"/>
  <line x1="200" y1="340" x2="200" y2="430" stroke="#cfe0d9" stroke-width="3"/>
  <!-- collar -->
  <path d="M168 336l32 34 32-34" fill="none" stroke="#dbe8e2" stroke-width="6" stroke-linecap="round"/>
  <!-- head -->
  <circle cx="200" cy="210" r="74" fill="#ffffff"/>
  <circle cx="200" cy="210" r="74" fill="#2a8a86" opacity="0.10"/>
  <!-- initials monogram -->
  <text x="200" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="58" font-weight="600" fill="#155e5c">PA</text>
  <!-- gold accent ring -->
  <circle cx="200" cy="210" r="92" fill="none" stroke="#e3cd9c" stroke-width="3" opacity="0.7"/>
</svg>
